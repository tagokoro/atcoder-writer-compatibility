default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: db
  username: postgres
  password: password

development:
  <<: *default
  database: atcoder-writer-compatibility

test:
  <<: *default
  database: atcoder-writer-compatibility-test

production:
  <<: *default
  database: atcoder-writer-compatibility-production
